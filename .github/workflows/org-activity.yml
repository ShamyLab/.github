name: Org activity calendar

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - scripts/org_activity.py
      - .github/workflows/org-activity.yml

permissions:
  contents: write

concurrency:
  group: org-activity
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build calendar
        env:
          GH_TOKEN: ${{ secrets.ORG_ACTIVITY_TOKEN }}
          ORG: ${{ github.repository_owner }}
          TZ_NAME: UTC            # e.g. America/New_York, so commits land on your local day
        run: python scripts/org_activity.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/assets
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update org activity calendar"
          git push
